<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>UTC+3 时钟</title>
  
  <!-- 连接到 PWA 清单 -->
  <link rel="manifest" href="manifest.json">
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  
  <style>
    body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
    .time-font { font-variant-numeric: tabular-nums; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-white flex flex-col items-center justify-center overflow-hidden">
  
  <div class="text-center px-4">
    <h1 id="time-display" class="time-font text-[22vw] sm:text-[18vw] font-bold text-black leading-none">00:00:00</h1>
    <p id="date-display" class="text-[6vw] sm:text-[4vw] text-gray-400 mt-6 font-medium tracking-widest">LOADING...</p>
    <div class="mt-10 inline-block px-5 py-1.5 rounded-full border border-gray-100 bg-gray-50 text-gray-400 text-[3vw] sm:text-sm font-bold tracking-widest">UTC +3</div>
  </div>

  <script>
    // 注册离线服务 (Service Worker)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    function updateClock() {
      const now = new Date();
      const targetOffset = 3 * 60; 
      const localOffset = now.getTimezoneOffset();
      const utc3Date = new Date(now.getTime() + (targetOffset + localOffset) * 60000);

      const h = String(utc3Date.getHours()).padStart(2, '0');
      const m = String(utc3Date.getMinutes()).padStart(2, '0');
      const s = String(utc3Date.getSeconds()).padStart(2, '0');
      const year = utc3Date.getFullYear();
      const month = String(utc3Date.getMonth() + 1).padStart(2, '0');
      const day = String(utc3Date.getDate()).padStart(2, '0');

      document.getElementById('time-display').textContent = `${h}:${m}:${s}`;
      document.getElementById('date-display').textContent = `${year}-${month}-${day}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
